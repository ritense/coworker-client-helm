backend:
  replicaCount: 1
  image:
    repository: ghcr.io/OWNER/coworker-client/backend
    tag: ""  # defaults to .Chart.appVersion
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8090
  resources: {}
  #  requests:
  #    cpu: 250m
  #    memory: 512Mi
  #  limits:
  #    cpu: 1000m
  #    memory: 1Gi

  db:
    url: "jdbc:postgresql://postgresql:5432/coworker_client"
    username: "coworker"
    # password: ""  -- set via --set or existingSecret

  rabbitmq:
    host: "rabbitmq"
    port: 5672
    username: "guest"
    # password: ""

  keycloak:
    baseUrl: "http://keycloak:8080"
    adminClientId: "admin-cli"
    adminUsername: "admin"
    # adminPassword: ""

  coworkerServer:
    url: "http://coworker-server:8080"
    username: "admin"
    # password: ""

  imap:
    pollIntervalMs: 60000

  # Provide the name of an existing Secret to load sensitive env vars from.
  # The secret must contain the keys listed in templates/backend/secret.yaml.
  # When set, the chart will NOT create its own Secret.
  existingSecret: ""

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/OWNER/coworker-client/frontend
    tag: ""  # defaults to .Chart.appVersion
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  #  nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  host: "coworker.example.com"
  tls: []
  #  - secretName: coworker-tls
  #    hosts:
  #      - coworker.example.com

imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
