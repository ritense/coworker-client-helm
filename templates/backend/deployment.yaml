apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coworker-client.fullname" . }}-backend
  labels:
    {{- include "coworker-client.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "coworker-client.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "coworker-client.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "coworker-client.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: DB_URL
              value: {{ .Values.backend.db.url | quote }}
            - name: DB_USERNAME
              value: {{ .Values.backend.db.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "coworker-client.secretName" . }}
                  key: DB_PASSWORD
            - name: RABBITMQ_HOST
              value: {{ .Values.backend.rabbitmq.host | quote }}
            - name: RABBITMQ_PORT
              value: {{ .Values.backend.rabbitmq.port | quote }}
            - name: RABBITMQ_USERNAME
              value: {{ .Values.backend.rabbitmq.username | quote }}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "coworker-client.secretName" . }}
                  key: RABBITMQ_PASSWORD
            - name: KEYCLOAK_BASE_URL
              value: {{ .Values.backend.keycloak.baseUrl | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: {{ .Values.backend.keycloak.adminClientId | quote }}
            - name: KEYCLOAK_ADMIN_USERNAME
              value: {{ .Values.backend.keycloak.adminUsername | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "coworker-client.secretName" . }}
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: COWORKER_SERVER_URL
              value: {{ .Values.backend.coworkerServer.url | quote }}
            - name: COWORKER_SERVER_USERNAME
              value: {{ .Values.backend.coworkerServer.username | quote }}
            - name: COWORKER_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "coworker-client.secretName" . }}
                  key: COWORKER_SERVER_PASSWORD
            - name: IMAP_POLL_INTERVAL_MS
              value: {{ .Values.backend.imap.pollIntervalMs | quote }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
